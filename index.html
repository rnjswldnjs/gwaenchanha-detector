<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>괜찮아 판독기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --sub: #6e6e73; --line: #e5e3de;
    --real: #2f9e6b; --real-soft: #e6f4ec; --fake: #d6453d; --fake-soft: #fbe9e7; --track: #f0eeea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    display: flex; justify-content: center; padding: 28px 16px 40px;
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
  header h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.6px; }
  header p { color: var(--sub); font-size: 14px; margin-top: 4px; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .label { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 10px; }

  .rec {
    width: 100%; border: 0; background: var(--ink); color: #fff; font: inherit;
    font-size: 17px; font-weight: 700; padding: 18px; border-radius: 14px; cursor: pointer;
  }
  .rec:disabled { opacity: .55; cursor: default; }
  .progress { height: 6px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 14px; }
  .progress div { height: 100%; width: 0; background: #e8a33d; border-radius: 4px; }
  .status { font-size: 14px; color: var(--sub); margin-top: 10px; min-height: 20px; }
  .status.err { color: var(--fake); }

  .result { text-align: center; padding: 34px 18px 30px; transition: background .2s; }
  .result.real { background: var(--real-soft); border-color: #c5e6d3; }
  .result.fake { background: var(--fake-soft); border-color: #f3c2be; }
  .verdict { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; }
  .verdict.idle { color: #b5b2ab; font-size: 21px; }
  .verdict.real { color: var(--real); }
  .verdict.fake { color: var(--fake); }
  .pct { font-size: 16px; color: var(--sub); margin-top: 8px; min-height: 22px; }
  .split { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin: 18px auto 0; max-width: 280px; background: var(--track); }
  .split .r { background: var(--real); }
  .split .f { background: var(--fake); }
  .split-legend { display: flex; justify-content: space-between; max-width: 280px; margin: 6px auto 0; font-size: 12px; color: var(--sub); }

  .history { display: flex; gap: 6px; flex-wrap: wrap; min-height: 26px; }
  .history .empty { font-size: 13px; color: #b5b2ab; }
  .chip { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 20px; }
  .chip.real { background: var(--real-soft); color: var(--real); }
  .chip.fake { background: var(--fake-soft); color: var(--fake); }

  footer { font-size: 12px; color: var(--sub); text-align: center; line-height: 1.7; margin-top: 6px; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>괜찮아 판독기</h1>
    <p>버튼을 누르고 2초 안에 "괜찮아"라고 말하면, 진짜인지 가짜인지 판별해요.</p>
  </header>

  <div class="card">
    <button class="rec" id="recBtn">누르고 "괜찮아" 말하기</button>
    <div class="progress"><div id="bar"></div></div>
    <div class="status" id="status">처음 누를 때 마이크 권한을 허용해주세요</div>
  </div>

  <div class="card result" id="resultCard">
    <div class="verdict idle" id="verdict">아직 판독 전</div>
    <div class="pct" id="pct"></div>
    <div id="splitBox"></div>
  </div>

  <div class="card">
    <div class="label">최근 판독</div>
    <div class="history" id="history"><span class="empty">아직 없음</span></div>
  </div>

  <footer>
    모든 판독은 이 브라우저 안에서만 이루어지고, 목소리는 저장되지 않아요.<br>
    모델: <a id="modelLink" href="#" target="_blank" rel="noopener">Teachable Machine</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
<script>
// ===== 1. 모델 링크 (주소 뒤에 ?model=링크 를 붙이면 다른 모델로 바꿔서 테스트 가능) =====
const DEFAULT_MODEL_URL = "https://teachablemachine.withgoogle.com/models/hm7RJYJKV/";

const params = new URLSearchParams(location.search);
const MODEL_URL = (params.get("model") || DEFAULT_MODEL_URL).replace(/\/?$/, "/");

// ===== 2. 판정 설정 =====
const CFG = {
  recordMs: 2000,      // 버튼을 누른 뒤 듣는 시간
  speechMin: 0.3,      // 진짜+가짜 확률 합이 이 이상인 순간만 "말소리"로 보고 판정에 씀
  fakeThreshold: 0.5   // 가짜 비중이 이 이상이면 가짜 (가짜를 더 잘 잡고 싶으면 0.4처럼 낮춤)
};

// ===== 3. 상태 =====
let recognizer = null;
let idx = { real: -1, fake: -1 };
let busy = false;
const history = [];

const $ = id => document.getElementById(id);
$("modelLink").href = MODEL_URL;

function setStatus(text, isErr) {
  $("status").textContent = text;
  $("status").className = "status" + (isErr ? " err" : "");
}

async function loadModel() {
  setStatus("모델 불러오는 중...");
  recognizer = speechCommands.create("BROWSER_FFT", undefined, MODEL_URL + "model.json", MODEL_URL + "metadata.json");
  await recognizer.ensureModelLoaded();
  const labels = recognizer.wordLabels();
  idx.real = labels.findIndex(l => l.includes("진짜"));
  idx.fake = labels.findIndex(l => l.includes("가짜"));
  if (idx.real < 0 || idx.fake < 0) {
    throw new Error("클래스 이름에 '진짜'와 '가짜'가 들어가야 해요. 현재: " + labels.join(", "));
  }
}

// ===== 4. 2초 녹음 → 자동 정지 → 판정 =====
async function recordOnce() {
  if (busy) return;
  busy = true;
  const btn = $("recBtn");
  btn.disabled = true;

  try {
    if (!recognizer) await loadModel();

    let sumReal = 0, sumFake = 0, heard = 0;

    await recognizer.listen(result => {
      const s = result.scores;
      const pReal = s[idx.real], pFake = s[idx.fake];
      if (pReal + pFake >= CFG.speechMin) {   // 말소리가 있는 순간만 모음
        sumReal += pReal;
        sumFake += pFake;
        heard++;
      }
    }, {
      includeSpectrogram: false,
      probabilityThreshold: 0,
      invokeCallbackOnNoiseAndUnknown: true,
      overlapFactor: 0.75
    });

    // 진행 막대 + 남은 시간 표시
    const t0 = performance.now();
    await new Promise(resolve => {
      const tick = () => {
        const p = Math.min((performance.now() - t0) / CFG.recordMs, 1);
        $("bar").style.width = (p * 100) + "%";
        setStatus(`듣는 중... ${((1 - p) * CFG.recordMs / 1000).toFixed(1)}초`);
        if (p < 1) requestAnimationFrame(tick); else resolve();
      };
      tick();
    });

    await recognizer.stopListening();
    $("bar").style.width = "0%";

    if (heard === 0) {
      setStatus("잘 안 들렸어요. 조금 더 크게 다시 말해주세요", true);
    } else {
      showResult(sumReal, sumFake);
      setStatus("판독 완료. 다시 하려면 버튼을 누르세요");
    }
  } catch (e) {
    console.error(e);
    if (recognizer && recognizer.isListening()) await recognizer.stopListening();
    $("bar").style.width = "0%";
    setStatus("오류: " + (e.message || e), true);
  }

  btn.disabled = false;
  busy = false;
}

// ===== 5. 결과 화면 =====
function showResult(sumReal, sumFake) {
  const fakeRatio = sumFake / (sumReal + sumFake);
  const isFake = fakeRatio >= CFG.fakeThreshold;
  const conf = isFake ? fakeRatio : 1 - fakeRatio;

  const v = $("verdict");
  v.textContent = isFake ? "가짜 괜찮아" : "진짜 괜찮아";
  v.className = "verdict " + (isFake ? "fake" : "real");
  $("resultCard").className = "card result " + (isFake ? "fake" : "real");
  $("pct").textContent = `확률 ${Math.round(conf * 100)}%`;

  const r = Math.round((1 - fakeRatio) * 100), f = 100 - r;
  $("splitBox").innerHTML = `
    <div class="split"><div class="r" style="width:${r}%"></div><div class="f" style="width:${f}%"></div></div>
    <div class="split-legend"><span>진짜 ${r}%</span><span>가짜 ${f}%</span></div>`;

  history.unshift(isFake);
  if (history.length > 10) history.pop();
  $("history").innerHTML = history.map(x =>
    `<span class="chip ${x ? "fake" : "real"}">${x ? "가짜" : "진짜"}</span>`
  ).join("");
}

$("recBtn").addEventListener("click", recordOnce);
</script>
</body>
</html>
